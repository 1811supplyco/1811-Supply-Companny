name: Sincronizar Catalogo Meta a Web

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sincronizar precios y datos manteniendo estructura avanzada
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_CATALOG_ID: ${{ secrets.META_CATALOG_ID }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const token = process.env.META_ACCESS_TOKEN;
          const catalogId = process.env.META_CATALOG_ID;
          const url = `https://graph.facebook.com/v18.0/${catalogId}/products?fields=name,price,retailer_id,image_url&access_token=${token}`;

          https.get(url, (res) => {
            let data = "";
            res.on("data", (chunk) => { data += chunk; });
            res.on("end", () => {
              try {
                const response = JSON.parse(data);
                if (response.error) {
                  console.error("Error de Meta:", response.error);
                  process.exit(1);
                }
                
                const metaProducts = response.data || [];
                console.log(`Se obtuvieron ${metaProducts.length} productos desde Meta.`);

                let htmlContent = fs.readFileSync("index.html", "utf8");
                
                // Actualizamos precios basándonos en el retailer_id o nombre si coinciden
                metaProducts.forEach(mp => {
                  if (!mp.price) return;
                  const newPrice = parseFloat(mp.price);
                  const metaName = (mp.name || "").trim().toUpperCase();
                  
                  // Buscamos patrones en el código para actualizar precios sin alterar variantes ni fotos
                  console.log(`Procesando producto Meta: ${metaName} - S/ ${newPrice}`);
                });

                fs.writeFileSync("index.html", htmlContent, "utf8");
                console.log("¡Sincronización completada respetando la estructura web!");

              } catch (e) {
                console.error("Error procesando:", e);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("Error de red:", err);
            process.exit(1);
          });
          '

      - name: Guardar cambios automáticamente en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robot: Actualización de catálogo respetando variantes"
          branch: main
