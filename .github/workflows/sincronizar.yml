name: Sincronizar Catalogo Meta a Web

on:
  schedule:
    # Se ejecutará automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras desde GitHub

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Descargar productos desde Meta y actualizar Web
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_CATALOG_ID: ${{ secrets.META_CATALOG_ID }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const token = process.env.META_ACCESS_TOKEN;
          const catalogId = process.env.META_CATALOG_ID;
          const url = `https://graph.facebook.com/v18.0/${catalogId}/products?fields=id,name,description,price,image_url,retailer_id&access_token=${token}`;

          https.get(url, (res) => {
            let data = "";
            res.on("data", (chunk) => { data += chunk; });
            res.on("end", () => {
              try {
                const response = JSON.parse(data);
                if (!response.data) {
                  console.error("Error al obtener datos de Meta:", response);
                  process.exit(1);
                }
                
                console.log(`Se encontraron ${response.data.length} productos en Meta.`);
                // Próximamente aquí inyectaremos la magia para actualizar tu index.html
              } catch (e) {
                console.error("Error procesando JSON:", e);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("Error de red:", err);
            process.exit(1);
          });
          '
