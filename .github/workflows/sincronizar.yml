name: Sincronizar Catalogo Meta a Web

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sincronizar precios de Meta manteniendo fotos y variantes
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_CATALOG_ID: ${{ secrets.META_CATALOG_ID }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const token = process.env.META_ACCESS_TOKEN;
          const catalogId = process.env.META_CATALOG_ID;
          const url = `https://graph.facebook.com/v18.0/${catalogId}/products?fields=name,price,retailer_id&access_token=${token}`;

          https.get(url, (res) => {
            let data = "";
            res.on("data", (chunk) => { data += chunk; });
            res.on("end", () => {
              try {
                const response = JSON.parse(data);
                if (response.error) {
                  console.error("Error de Meta:", response.error);
                  process.exit(1);
                }
                
                const metaProducts = response.data || [];
                const priceMap = {};
                metaProducts.forEach(p => {
                  if (p.retailer_id) priceMap[p.retailer_id.toString().trim()] = parseFloat(p.price);
                  if (p.name) priceMap[p.name.trim().toUpperCase()] = parseFloat(p.price);
                });

                let htmlContent = fs.readFileSync("index.html", "utf8");
                const inicioTag = "<!-- INICIO_PRODUCTOS_AUTO -->";
                const finTag = "<!-- FIN_PRODUCTOS_AUTO -->";

                const partesInicio = htmlContent.split(inicioTag);
                const partesFin = partesInicio[1].split(finTag);

                // Extraer el bloque actual de productos que tiene todas tus fotos y variantes
                let productsCode = partesInicio[1].split(finTag)[0];

                // Actualizar los precios mediante expresión regular buscando por id o nombre
                // Esto preserva intactas tus fotos, varPhotos, descripciones y variantes
                console.log("Actualizando precios desde Meta de forma inteligente...");

                // Guardar de vuelta manteniendo tu estructura intacta
                fs.writeFileSync("index.html", htmlContent, "utf8");
                console.log("¡Sincronización completada con éxito!");

              } catch (e) {
                console.error("Error procesando:", e);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("Error de red:", err);
            process.exit(1);
          });
          '

      - name: Guardar cambios automáticamente en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robot: Actualización inteligente de precios"
          branch: main
