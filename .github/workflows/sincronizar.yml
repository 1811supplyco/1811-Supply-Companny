name: Sincronizar Catalogo Meta a Web

on:
  schedule:
    - cron: '0 */6 * * x'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Descargar productos desde Meta y actualizar index.html
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_CATALOG_ID: ${{ secrets.META_CATALOG_ID }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const token = process.env.META_ACCESS_TOKEN;
          const catalogId = process.env.META_CATALOG_ID;
          const url = `https://graph.facebook.com/v18.0/${catalogId}/products?fields=id,name,description,price,image_url,retailer_id&access_token=${token}`;

          https.get(url, (res) => {
            let data = "";
            res.on("data", (chunk) => { data += chunk; });
            res.on("end", () => {
              try {
                const response = JSON.parse(data);
                if (response.error) {
                  console.error("Error de la API de Meta:", response.error);
                  process.exit(1);
                }
                
                const rawProducts = response.data || [];
                console.log(`Se encontraron ${rawProducts.length} productos en Meta.`);

                // Mapeo respetando tu estructura exacta (id, cat, name, desc, price, imgs)
                const productsList = rawProducts.map((p, index) => {
                  let categoria = "ACCESORIOS";
                  const nombreUpper = (p.name || "").toUpperCase();
                  if (nombreUpper.includes("DOPP KIT") || nombreUpper.includes("BRIEFCASE")) categoria = "BOLSOS";
                  else if (nombreUpper.includes("WALLET")) categoria = "BILLETERAS";
                  else if (nombreUpper.includes("BELT")) categoria = "CINTURONES";
                  else if (nombreUpper.includes("LLAVERO") || nombreUpper.includes("GANCHO") || nombreUpper.includes("CARABINER")) categoria = "LLAVEROS";
                  else if (nombreUpper.includes("BEAD")) categoria = "BEADS";
                  else if (nombreUpper.includes("STRAP")) categoria = "STAGE GEAR";

                  return {
                    id: p.retailer_id || index + 1,
                    cat: categoria,
                    name: p.name || "",
                    desc: p.description || "",
                    price: parseFloat(p.price) || 0,
                    imgs: p.image_url ? [p.image_url] : ["images/placeholder.webp"],
                    variants: []
                  };
                });

                const newProductsCode = "    const products = " + JSON.stringify(productsList, null, 4) + ";";

                let htmlContent = fs.readFileSync("index.html", "utf8");
                const inicioTag = "<!-- INICIO_PRODUCTOS_AUTO -->";
                const finTag = "<!-- FIN_PRODUCTOS_AUTO -->";

                const partesInicio = htmlContent.split(inicioTag);
                const partesFin = partesInicio[1].split(finTag);

                const nuevoHtml = partesInicio[0] + inicioTag + "\n" + newProductsCode + "\n    " + finTag + partesFin[1];

                fs.writeFileSync("index.html", nuevoHtml, "utf8");
                console.log("¡index.html sincronizado correctamente!");

              } catch (e) {
                console.error("Error procesando datos:", e);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("Error de red:", err);
            process.exit(1);
          });
          '

      - name: Guardar cambios automáticamente en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robot: Sincronización automática de productos"
          branch: main
