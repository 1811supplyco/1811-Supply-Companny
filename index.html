      "@context": "https://schema.org",

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #ffffff; margin: 0; }
        .font-title { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .panel-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        #category-panel-mobile { transform: translateX(-100%); }
        #category-panel-mobile.active { transform: translateX(0); }
        #cart-panel { transform: translateX(100%); }
        #cart-panel.active { transform: translateX(0); }
        .product-card { background-color: #141414; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
        .variant-dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.2); }
        .variant-dot.active { transform: scale(1.3); border-color: #ffffff; }
    </style>
</head>
<body>

    <div class="bg-white text-black text-[10px] font-black uppercase tracking-widest py-2 text-center border-b border-zinc-800">
        ENVIOS A TODO EL PERÚ • 1811 SUPPLY CO.
    </div>

    <nav class="sticky top-0 z-40 bg-[#0d0d0d]/90 backdrop-blur-md border-b border-zinc-900 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button class="md:hidden text-white" onclick="toggleCategoriesMobile()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a href="index.html" class="font-title text-lg tracking-tighter text-white">1811 SUPPLY CO.</a>
        </div>
        
        <div class="hidden md:flex items-center gap-6 text-[11px] font-black uppercase tracking-wider text-zinc-400">
            <button onclick="filterProducts('all')" class="hover:text-white transition">Todos</button>
            <button onclick="filterProducts('STRAPS')" class="hover:text-white transition">Straps</button>
            <button onclick="filterProducts('DOPP KITS')" class="hover:text-white transition">Dopp Kits</button>
            <button onclick="filterProducts('BILLETERAS')" class="hover:text-white transition">Billeteras</button>
            <button onclick="filterProducts('TARJETEROS')" class="hover:text-white transition">Tarjeteros</button>
            <button onclick="filterProducts('PORTAPASAPORTES')" class="hover:text-white transition">Portapasaportes</button>
            <button onclick="filterProducts('LLAVEROS')" class="hover:text-white transition">Llaveros</button>
        </div>

        <div class="flex items-center gap-4">
            <button class="relative text-white p-1" onclick="toggleCart()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-white text-black font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </nav>

    <div id="category-panel-mobile" class="fixed inset-y-0 left-0 z-50 w-64 bg-[#0d0d0d] border-r border-zinc-900 p-6 panel-transition md:hidden">
        <div class="flex items-center justify-between mb-8">
            <h3 class="font-title text-sm tracking-wider text-zinc-400">Categorías</h3>
            <button class="text-white" onclick="toggleCategoriesMobile()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="flex flex-col gap-5 text-xs font-black uppercase tracking-widest text-zinc-400">
            <button onclick="filterProducts('all'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Todos</button>
            <button onclick="filterProducts('STRAPS'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Straps</button>
            <button onclick="filterProducts('DOPP KITS'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Dopp Kits</button>
            <button onclick="filterProducts('BILLETERAS'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Billeteras</button>
            <button onclick="filterProducts('TARJETEROS'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Tarjeteros</button>
            <button onclick="filterProducts('PORTAPASAPORTES'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Portapasaportes</button>
            <button onclick="filterProducts('LLAVEROS'); toggleCategoriesMobile()" class="text-left hover:text-white transition">Llaveros</button>
        </div>
    </div>

    <div id="cart-panel" class="fixed inset-y-0 right-0 z-50 w-full sm:w-80 bg-[#0d0d0d] border-l border-zinc-900 p-6 panel-transition flex flex-col justify-between">
        <div>
            <div class="flex items-center justify-between mb-6 border-b border-zinc-900 pb-4">
                <h3 class="font-title text-sm tracking-wider">Tu Carrito</h3>
                <button class="text-white" onclick="toggleCart()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="cart-items" class="flex flex-col gap-4 overflow-y-auto max-h-[60vh] no-scrollbar">
                </div>
        </div>
        <div class="border-t border-zinc-900 pt-4 mt-4">
            <div class="flex items-center justify-between font-black uppercase text-xs mb-4">
                <span>Total</span>
                <span id="cart-total">S/ 0.00</span>
            </div>
            <button class="w-full bg-white text-black font-black uppercase text-[10px] tracking-widest py-3 hover:bg-zinc-200 transition" onclick="checkoutWhatsApp()">
                Completar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="home-view" class="space-y-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative h-[240px] md:h-[340px] bg-zinc-950 overflow-hidden cursor-pointer group" onclick="filterProducts('STRAPS')">
                    <img src="images/bannerstraps.webp" class="w-full h-full object-cover opacity-60 group-hover:scale-105 transition duration-700" alt="Straps">
                    <div class="absolute inset-0 flex flex-col justify-end p-6 bg-gradient-to-t from-black/80 via-black/20 to-transparent">
                        <span class="text-[9px] font-black tracking-widest text-zinc-400 uppercase mb-1">Colección Premium</span>
                        <h2 class="font-title text-xl md:text-2xl text-white tracking-tighter leading-none">STRAPS PARA CAMARAS</h2>
                    </div>
                </div>
                <div class="relative h-[240px] md:h-[340px] bg-zinc-950 overflow-hidden cursor-pointer group" onclick="filterProducts('DOPP KITS')">
                    <img src="images/bannerdopps.webp" class="w-full h-full object-cover opacity-60 group-hover:scale-105 transition duration-700" alt="Dopp Kits">
                    <div class="absolute inset-0 flex flex-col justify-end p-6 bg-gradient-to-t from-black/80 via-black/20 to-transparent">
                        <span class="text-[9px] font-black tracking-widest text-zinc-400 uppercase mb-1">Organización de viaje</span>
                        <h2 class="font-title text-xl md:text-2xl text-white tracking-tighter leading-none">DOPP KITS / NECESER</h2>
                    </div>
                </div>
            </div>
            
            <div id="feed-container" class="space-y-12"></div>
        </div>

        <div id="catalog-view" class="hidden">
            <div class="flex items-center justify-between mb-6 border-b border-zinc-900 pb-4">
                <h2 id="catalog-title" class="font-title text-sm tracking-wider text-zinc-400">Catálogo</h2>
                <button onclick="filterProducts('all')" class="text-[10px] font-black uppercase text-zinc-500 hover:text-white transition">Ver Todo</button>
            </div>
            <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-x-4 gap-y-8"></div>
        </div>

        <div id="product-view" class="hidden max-w-4xl mx-auto pt-4">
            </div>
    </main>

    <footer class="border-t border-zinc-900 mt-20 py-8 px-4 text-center text-[10px] uppercase tracking-widest text-zinc-600 font-bold">
        © 2026 1811 SUPPLY CO. Todos los derechos reservados. Hecho en Perú.
    </footer>

    <script>
        const products = [
            {
                id: "strap-cam-01",
                name: "Strap de Cámara Premium Camo",
                cat: "STRAPS",
                price: "85.00",
                desc: "Diseñado para fotógrafos que buscan seguridad, resistencia y un estilo único. Fabricado con materiales de alta tracción y terminaciones reforzadas.",
                variants: [
                    { name: "Camo Original", dots: "#4B5320", imgs: ["images/camostrap1.webp", "images/camostrap2.webp", "images/camostrap3.webp"] },
                    { name: "Negro Táctico", dots: "#111111", imgs: ["images/strapnegro1.webp", "images/strapnegro2.webp", "images/strapnegro3.webp", "images/strapnegro4.webp"] }
                ]
            },
            {
                id: "dopp-kit-01",
                name: "Dopp Kit Viajero Impermeable",
                cat: "DOPP KITS",
                price: "120.00",
                desc: "Tu compañero ideal de ruta. Espacio optimizado para tus artículos de aseo personal con forro impermeable fácil de limpiar y cierre de alta resistencia.",
                variants: [
                    { name: "Camo Black", dots: "#2d302e", imgs: ["images/camodoppkit.webp", "images/camodoppkit2.webp", "images/camodoppkit3.webp"] },
                    { name: "Verde Oliva", dots: "#3b443b", imgs: ["images/olivadoppkit.webp", "images/olivadoppkit2.webp"] }
                ]
            },
            {
                id: "billetera-01",
                name: "Billetera Minimalista Slim",
                cat: "BILLETERAS",
                price: "65.00",
                desc: "Cero bulto, máxima eficiencia. Espacio para billetes desplegados y las tarjetas esenciales que usas el día a día. Cuero genuino estructurado de alta duración.",
                variants: [
                    { name: "Marrón Rústico", dots: "#5C4033", imgs: ["images/billeteramarron1.webp", "images/billeteramarron2.webp"] },
                    { name: "Negro Mate", dots: "#1A1A1A", imgs: ["images/billeteranegra1.webp"] }
                ]
            },
            {
                id: "tarjetero-01",
                name: "Tarjetero de Acceso Rápido",
                cat: "TARJETEROS",
                price: "45.00",
                desc: "Diseño ultra delgado para llevar en el bolsillo delantero sin notar que está ahí. Capacidad de hasta 6 tarjetas y compartimento central oculto.",
                variants: [
                    { name: "Negro Carbón", dots: "#222222", imgs: ["images/tarjeteronegro1.webp", "images/tarjeteronegro2.webp"] }
                ]
            },
            {
                id: "portapasaporte-01",
                name: "Portapasaporte Documentero",
                cat: "PORTAPASAPORTES",
                price: "95.00",
                desc: "Protege tu pasaporte y mantén organizados tus pases de abordar, tarjetas de viajero frecuente y efectivo en un solo lugar seguro.",
                variants: [
                    { name: "Camo Foliage", dots: "#556B2F", imgs: ["images/pasaportecamo1.webp", "images/pasaportecamo2.webp"] }
                ]
            },
            {
                id: "llavero-01",
                name: "Llavero Loop de Alta Resistencia",
                cat: "LLAVEROS",
                price: "35.00",
                desc: "Mosquetón de grado militar y cinta reforzada para llevar tus llaves seguras en el cinturón o la mochila con un desenganche rápido.",
                variants: [
                    { name: "Negro Total", dots: "#000000", imgs: ["images/llaveronegro1.webp"] },
                    { name: "Verde Militar", dots: "#485043", imgs: ["images/llaveroverde1.webp"] }
                ]
            }
        ];

        // ==========================================
        // CONFIGURACIÓN DE CAMPAÑA DE DESCUENTO
        // ==========================================
        const ACTIVAR_DESCUENTO = true; // Cambia a true para activar el 15%, o a false para apagarlo
        const PORCENTAJE_DESCUENTO = 0.15; // 0.15 representa el 15% de descuento

        let cart = [];

        // Función auxiliar para obtener el precio correcto del producto evaluando la promoción
        function getProductPrice(basePrice) {
            const originalPrice = Number(basePrice);
            if (ACTIVAR_DESCUENTO) {
                const finalPrice = originalPrice * (1 - PORCENTAJE_DESCUENTO);
                return {
                    original: originalPrice.toFixed(2),
                    final: finalPrice,
                    isPromo: true
                };
            }
            return {
                original: originalPrice.toFixed(2),
                final: originalPrice,
                isPromo: false
            };
        }

        function init() {
            renderHomeWithBanners();
            updateCartUI();
        }

        function renderHomeWithBanners() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';
            
            const categories = ["STRAPS", "DOPP KITS", "BILLETERAS", "TARJETEROS", "PORTAPASAPORTES", "LLAVEROS"];
            
            categories.forEach(cat => {
                const catProducts = products.filter(p => p.cat === cat);
                if(catProducts.length === 0) return;
                
                let sectionHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between border-b border-zinc-900 pb-2">
                            <h3 class="font-title text-xs tracking-widest text-zinc-400">${cat}</h3>
                            <button onclick="filterProducts('${cat}')" class="text-[9px] font-black uppercase text-zinc-500 hover:text-white transition">Ver Todo</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-x-4 gap-y-8">
                `;
                
                catProducts.slice(0, 4).forEach(prod => {
                    const priceInfo = getProductPrice(prod.price);
                    let priceHTML = ``;
                    if (priceInfo.isPromo) {
                        priceHTML = `
                            <span class="text-zinc-500 line-through mr-1">S/ ${priceInfo.original}</span>
                            <span class="text-red-500 font-black">S/ ${priceInfo.final.toFixed(2)}</span>
                        `;
                    } else {
                        priceHTML = `<span class="text-white">S/ ${priceInfo.original}</span>`;
                    }

                    sectionHTML += `
                        <div class="cursor-pointer group flex flex-col" onclick="viewProduct('${prod.id}')">
                            <div class="relative w-full aspect-square bg-zinc-950 overflow-hidden mb-3">
                                <img src="${prod.variants[0].imgs[0]}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${prod.name}">
                            </div>
                            <h4 class="text-[11px] font-black uppercase tracking-tight text-zinc-300 group-hover:text-white transition line-clamp-1">${prod.name}</h4>
                            <p class="text-[10px] font-bold text-zinc-500 mt-0.5 uppercase tracking-tighter">${prod.variants.length} Variante(s)</p>
                            <p class="text-[11px] mt-1 uppercase font-black">${priceHTML}</p>
                        </div>
                    `;
                });
                
                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            });
        }

        function filterProducts(category) {
            const homeView = document.getElementById('home-view');
            const catalogView = document.getElementById('catalog-view');
            const productView = document.getElementById('product-view');
            const title = document.getElementById('catalog-title');
            const grid = document.getElementById('catalog-grid');
            
            productView.classList.add('hidden');
            
            if(category === 'all' || category === '') {
                homeView.classList.remove('hidden');
                catalogView.classList.add('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            
            homeView.classList.add('hidden');
            catalogView.classList.remove('hidden');
            title.innerText = category;
            grid.innerHTML = '';
            
            const filtered = products.filter(p => p.cat === category);
            
            filtered.forEach(prod => {
                const priceInfo = getProductPrice(prod.price);
                let priceHTML = ``;
                if (priceInfo.isPromo) {
                    priceHTML = `
                        <span class="text-zinc-500 line-through mr-1">S/ ${priceInfo.original}</span>
                        <span class="text-red-500 font-black">S/ ${priceInfo.final.toFixed(2)}</span>
                    `;
                } else {
                    priceHTML = `<span class="text-white">S/ ${priceInfo.original}</span>`;
                }

                grid.innerHTML += `
                    <div class="cursor-pointer group flex flex-col" onclick="viewProduct('${prod.id}')">
                        <div class="relative w-full aspect-square bg-zinc-950 overflow-hidden mb-3">
                            <img src="${prod.variants[0].imgs[0]}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${prod.name}">
                        </div>
                        <h4 class="text-[11px] font-black uppercase tracking-tight text-zinc-300 group-hover:text-white transition line-clamp-1">${prod.name}</h4>
                        <p class="text-[10px] font-bold text-zinc-500 mt-0.5 uppercase tracking-tighter">${prod.variants.length} Variante(s)</p>
                        <p class="text-[11px] mt-1 uppercase font-black">${priceHTML}</p>
                    </div>
                `;
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function viewProduct(id) {
            const prod = products.find(p => p.id === id);
            if(!prod) return;
            
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('catalog-view').classList.add('hidden');
            
            const view = document.getElementById('product-view');
            view.classList.remove('hidden');
            
            const priceInfo = getProductPrice(prod.price);
            let priceHTML = ``;
            if (priceInfo.isPromo) {
                priceHTML = `
                    <span class="text-zinc-500 line-through mr-2">S/ ${priceInfo.original}</span>
                    <span class="text-red-500 font-black">S/ ${priceInfo.final.toFixed(2)}</span>
                `;
            } else {
                priceHTML = `<span class="text-white">S/ ${priceInfo.original}</span>`;
            }
            
            let variantDots = '';
            prod.variants.forEach((v, idx) => {
                variantDots += `<div class="variant-dot ${idx===0?'active':''}" style="background-color: ${v.dots};" onclick="changeVariant(${idx})" title="${v.name}"></div>`;
            });

            view.innerHTML = `
                <button class="text-[10px] font-black uppercase tracking-widest text-zinc-500 hover:text-white transition mb-6 flex items-center gap-1" onclick="goHome()">
                    ← Regresar al catálogo
                </button>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                    <div class="space-y-3">
                        <div class="relative w-full aspect-square bg-zinc-950 overflow-hidden">
                            <img id="main-product-img" src="${prod.variants[0].imgs[0]}" class="absolute inset-0 w-full h-full object-cover" alt="${prod.name}">
                        </div>
                        <div id="thumb-container" class="flex gap-2 overflow-x-auto no-scrollbar">
                            ${prod.variants[0].imgs.map(img => `<img src="${img}" class="w-16 h-16 object-cover bg-zinc-950 cursor-pointer border border-zinc-900 hover:border-zinc-700" onclick="document.getElementById('main-product-img').src='${img}'">`).join('')}
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <span class="text-[9px] font-black tracking-widest text-zinc-500 uppercase">${prod.cat}</span>
                            <h1 class="font-title text-xl md:text-2xl mt-1 tracking-tight">${prod.name}</h1>
                            <p id="product-view-price" class="text-lg uppercase font-black mt-2">${priceHTML}</p>
                        </div>
                        <div class="border-t border-zinc-900 pt-4">
                            <span class="text-[9px] font-black tracking-widest text-zinc-400 uppercase block mb-2">Variante: <span id="variant-name" class="text-white">${prod.variants[0].name}</span></span>
                            <div class="flex items-center gap-3">${variantDots}</div>
                        </div>
                        <div class="border-t border-zinc-900 pt-4">
                            <p class="text-zinc-400 text-xs leading-relaxed font-medium">${prod.desc}</p>
                        </div>
                        <button class="w-full bg-white text-black font-black uppercase text-[10px] tracking-widest py-3.5 hover:bg-zinc-200 transition" onclick="addToCart('${prod.id}')">
                            Agregar al Carrito
                        </button>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let activeVariantIndex = 0;
        function changeVariant(idx) {
            const urlParams = new URLSearchParams(window.location.search);
            const view = document.getElementById('product-view');
            const dots = view.querySelectorAll('.variant-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
            
            // Re-render gallery logic based on product context
            const activeHeader = view.querySelector('h1');
            if(!activeHeader) return;
            const prod = products.find(p => p.name === activeHeader.innerText);
            if(!prod) return;
            
            activeVariantIndex = idx;
            document.getElementById('variant-name').innerText = prod.variants[idx].name;
            document.getElementById('main-product-img').src = prod.variants[idx].imgs[0];
            
            const thumbContainer = document.getElementById('thumb-container');
            thumbContainer.innerHTML = prod.variants[idx].imgs.map(img => `<img src="${img}" class="w-16 h-16 object-cover bg-zinc-950 cursor-pointer border border-zinc-900 hover:border-zinc-700" onclick="document.getElementById('main-product-img').src='${img}'">`).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if(!prod) return;
            
            const variant = prod.variants[activeVariantIndex];
            const priceInfo = getProductPrice(prod.price);
            
            cart.push({
                id: prod.id,
                name: prod.name,
                currentVariant: variant.name,
                currentPrice: priceInfo.final
            });
            
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() { document.getElementById('cart-panel').classList.toggle('active'); }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            const total = document.getElementById('cart-total');
            
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-zinc-600 font-bold text-[10px] uppercase tracking-widest text-center py-8">Tu carrito está vacío.</p>`;
                total.innerText = `S/ 0.00`;
                return;
            }
            
            container.innerHTML = '';
            let sum = 0;
            cart.forEach((item, index) => {
                sum += item.currentPrice;
                container.innerHTML += `
                    <div class="flex items-center gap-3 border-b border-zinc-900 pb-3">
                        <div class="flex-1 text-[9px] uppercase font-black">
                            <h4 class="text-white">${item.name}</h4>
                            <p class="text-gray-500">${item.currentVariant || ''}</p>
                            <p class="text-white mt-1">S/ ${Number(item.currentPrice).toFixed(2)}</p>
                        </div>
                        <button class="text-red-500 text-xs" onclick=\"removeFromCart(${index})\">Eliminar</button>
                    </div>`;
            });
            total.innerText = `S/ ${sum.toFixed(2)}`;
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return;
            let sum = 0;
            let msg = `Hola 1811, quisiera realizar este pedido:\n\n`;
            cart.forEach(item => {
                msg += `• *${item.name}* ${item.currentVariant ? '('+item.currentVariant+')' : ''} - S/ ${Number(item.currentPrice).toFixed(2)}\n`;
                sum += item.currentPrice;
            });
            msg += `\n*TOTAL: S/ ${sum.toFixed(2)}*`;
            const phone = "51947833118";
            window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(msg)}`;
        }

        function toggleCategoriesMobile() { document.getElementById('category-panel-mobile').classList.toggle('active'); }
        function goHome() {
            window.location.href = 'index.html';
        }

        window.onload = init;
    </script>
</body>
</html>
